<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática 06 e 07</title>
    <style>
        body {
            font-size: 1.4em;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Feedback e Perfil do Usuário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Qual a sua cor favorita?</legend>

            <label for="icolor">Cor:</label>
            <input type="color" name="color" id="icolor">
            <br>
            <label for="ins">Nivel de Satisfação:</label>
            <input type="range" name="ns" id="ins" min="0" max="10" value="5">
        </fieldset>
        <fieldset>
            <legend>Perfil de Usuário</legend>

            <label for="ifp">Escolha sua foto de Perfil</label>
            <br>
            <input type="file" name="fp" id="ifp">
            <br>
            <label for="iest">Qual seu Estado:</label>
                <select name="estados" id="iest">
                    <option value="">Selecione seu estado</option>
                    <optgroup label="Região Norte">
                        <option value="AM">Amazonas</option>
                        <option value="PA">Pará</option>
                    </optgroup>

                    <optgroup label="Região Nordeste">
                        <option value="PI">Piauí</option>
                        <option value="PE">Pernambuco</option>
                    </optgroup>

                    <optgroup label="Região Centro-Oeste">
                        <option value="GO">Goiás</option>
                        <option value="MT">Mato Grosso</option>
                    </optgroup>

                    <optgroup label="Região Sudeste">
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </optgroup>

                    <optgroup label="Região Sul">
                        <option value="PR">Paraná</option>
                        <option value="RS">Rio Grande do Sul</option>
                    </optgroup>
                </select>
        </fieldset>

        <fieldset>
            <legend>Informações Profissionais</legend>
            <label for="iprof">Qual sua Profissao:</label>
            <br>
            <input type="text" name="prof" id="iprof" list="listadeprof" placeholder="Digite ou clique para ver">
            <datalist id="listadeprof">
                <option value="DEV">Desenvolvedor</option>
                <option value="ADM">Administrador</option>
                <option value="PROF">Professor</option>
                <option value="CONT">Contador</option>
                <option value="DSG">Designer</option>
                <option value="TCI">Técnico em Informática</option>
            </datalist>
        </fieldset>
        <fieldset>
            <legend>Mensagem</legend>
            <label for="feedback">Diga-nos o que achou do nosso formulário?</label>
            <br>
            <textarea name="feedback" id="feedback" cols="30" rows="8" placeholder="Digite algo"></textarea>
        </fieldset>
        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
