<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box 11</title>
    <style>
        .container {
            display: flex;
            background-color: rgba(255, 0, 0, 0.425);
            flex-flow: row nowrap;
        }
        .item {
            border: solid 1px;
            background-color: rgba(0, 0, 255, 0.452); 
            text-align: center;

            flex-basis: 200px;
        }
        #cxa {
            flex-shrink: 0;
            flex-grow: 1;
        }
        #cxb {
            flex-shrink: 1;
            flex-grow: 1;
        }
        #cxc {
            flex-shrink: 1;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxa">A</div>
        <div class="item" id="cxb">B</div>
        <div class="item" id="cxc">C</div>
    </div>
</body>
</html>
