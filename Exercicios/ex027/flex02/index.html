<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;

            background-color: rgba(255, 0, 0, 0.425);
        }
        .item {
            flex-wrap: none;
            text-align: center;
            padding: 10px;
            border: solid 1px;
            background-color: rgba(0, 0, 255, 0.452);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
