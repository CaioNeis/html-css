<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box 3</title>
    <style>
        .container {
            height: 400px;
            padding: 10px;
            /*Configuração Padrão*/display: flex;
            flex-flow: row nowrap;
            /* flex-direction: row;
            flex-wrap: nowrap; */

            /* Shorthand Flex direction + flex-wrap 
            
            -->   flex-flow: row nowrap*/
            
            background-color: rgba(255, 0, 0, 0.425);
        }
        .item {
            flex: auto;
            border: solid 1px;
            background-color: rgba(0, 0, 255, 0.452);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de Bloco A</div>
        <div class="item">Exemplo de Bloco B</div>
        <div class="item">Exemplo de Bloco C</div>
        <div class="item">Exemplo de Bloco D</div>
        <div class="item">Exemplo de Bloco E</div>
        <div class="item">Exemplo de Bloco F</div>
        <div class="item">Exemplo de Bloco G</div>
    </div>
</body>
</html>
