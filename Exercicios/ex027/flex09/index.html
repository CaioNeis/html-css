<head>

    <title>Flexible Box 9</title>

        .container {
            display: flex;
            background-color: rgba(255, 0, 0, 0.425);

            font-size: 20px;
            border: solid 1px;
            background-color: rgba(0, 0, 255, 0.452);
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>

        <div class="item">lsnjnlksaG</div>
    </div>

</html>
