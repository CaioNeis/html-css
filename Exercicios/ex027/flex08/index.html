<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box 8</title>
    <style>
        main {
            display: flex;
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: rgba(255, 0, 0, 0.425);
            display: flex;
            flex-flow: row wrap;
            width: 50%;        
            height: 50%;

            

        }
        .item {
            text-align: center;
            flex: auto;
            border: solid 1px;
            background-color: rgba(0, 0, 255, 0.452);
            
        }
        #i1 {
            align-self: center;
        }
        #i2 {
            
        }
        #i3 {
           align-self: flex-end;
        }
        #i4 {
            align-self: auto;
        }
        #i5 {
            align-self: center;
        }
        #i6 {
           
        }
        #i7 {
            align-self: stretch;
        }
        
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item" id="i1">A</div>
            <div class="item" id="i2">B</div>
            <div class="item" id="i3">C</div>
            <div class="item" id="i4">D</div>
            <div class="item" id="i5">E</div>
            <div class="item" id="i6">F</div>
            <div class="item" id="i7">G</div>
        </div>
    </main>
</body>
</html>
